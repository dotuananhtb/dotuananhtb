name: Profile assets

# Regenerates the live images (stats panel, contribution graph with snake)
# and publishes them to the `output` branch that README.md links to. If a run
# fails, the branch keeps the last good images, so the profile never shows
# broken ones. Static images live in assets/ (see scripts/build-static-assets.mjs).
#
# Work activity: the owner's machine pushes daily counts from a second
# account to the `activity-data` branch (scripts/export-work-activity.mjs).
# That branch is not the default branch, so its commits add no contributions.
# It holds no workflow file, so the sync job starts this workflow itself.
#
# Optional secret PROFILE_STATS_TOKEN: a fine-grained, read-only token of this
# profile's owner; it lets the stats count private repositories.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch work activity
        run: |
          if git fetch --depth=1 origin activity-data; then
            git show origin/activity-data:work-activity.json > work-activity.json
          else
            echo "No activity-data branch yet; rendering without work activity."
          fi

      - name: Render live images
        run: node scripts/render-live-assets.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          WORK_ACTIVITY: work-activity.json
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
